version: "3.8"

# Single-node Kafka broker, KRaft mode (no Zookeeper needed).
# Run this on your SERVER machine (the one that will process attendance).
#
# BEFORE RUNNING:
#   1. Install Tailscale on this machine and run `tailscale up`.
#   2. Run `tailscale ip -4` to get this machine's Tailscale IP.
#   3. Replace 100.x.x.x below with that IP (both places it appears).
#
# Then: docker compose up -d

services:
  kafka:
    # Bitnami moved the former free image catalogue to bitnamilegacy.
    # Keep Kafka 3.7.x because this configuration targets that release.
    image: bitnamilegacy/kafka:3.7.1-debian-12-r0
    container_name: attendance-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # --- KRaft mode settings (Kafka's own built-in consensus, replaces Zookeeper) ---
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@localhost:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      # This is the address edge clients (on OTHER networks) will connect to.
      # Must be reachable from the edge machines -> use your Tailscale IP.
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://100.76.209.67:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
      # Auto-create topics so you don't need a separate setup step
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      # Don't let old frames pile up forever - keep 6 hours of history max
      - KAFKA_CFG_LOG_RETENTION_HOURS=6
    volumes:
      - kafka_data:/bitnami/kafka

volumes:
  kafka_data:
